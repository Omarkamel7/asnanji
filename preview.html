      color: #0f172a;

    .phone-container {
      width: 100%;

      height: 890px;

      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Top Status Bar */
    .status-bar {
      background: #0284c7;
      color: white;
      padding: 10px 20px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      z-index: 40;
    }

    /* App Header */
    .app-header {
      background: #ffffff;
      padding: 10px 16px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }

    .header-branding {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      object-fit: cover;
    }

    .header-title {
      font-size: 14px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.2;
    }

    .header-subtitle {
      font-size: 11px;
      color: #0284c7;
      font-weight: 700;
    }

    .header-lang-btn {
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
    }

    /* Main Scrollable Content Area */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 85px;
    }

    /* Cards & Components */
    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
    }

    .hero-card {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      color: white;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.25);
    }

    .doctor-avatar-circle {
      width: 65px;
      height: 65px;
      border-radius: 33px;
      border: 2.5px solid white;
      object-fit: cover;
      object-position: center 10%;
    }

    .hero-text h3 {
      font-size: 16px;
      font-weight: 900;
    }

    .hero-text p {
      font-size: 11px;
      opacity: 0.9;
      margin-top: 3px;
      line-height: 1.4;
    }

    /* Action Buttons */
    .action-card {
      background: white;
      border: 1.5px solid #e0f2fe;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: all 0.2s;
    }

    .action-card:hover {
      border-color: #0284c7;
      transform: translateY(-2px);
    }

    .action-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #0284c7;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .action-info {
      flex: 1;
    }

    .action-info strong {
      font-size: 14px;
      color: #0f172a;
      display: block;
    }

    .action-info span {
      font-size: 11px;
      color: #64748b;
    }

    /* Chips Grid */
    .chips-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .chip-btn {
      padding: 8px 12px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .chip-btn.active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
      font-weight: 800;
    }

    /* Form Fields */
    .input-field {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 12px;
      background: #f8fafc;
      outline: none;
      margin-top: 5px;
    }

    .input-field:focus {
      border-color: #0284c7;
      background: white;
    }

    .textarea-field {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 12px;
      background: #f8fafc;
      outline: none;
      min-height: 80px;
      resize: vertical;
      margin-top: 5px;
    }

    .btn-primary {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      width: 100%;

      align-items: center;
      justify-content: center;

      background: #0369a1;

    .tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: white;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      z-index: 50;

      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;

      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;

      border-radius: 16px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 8px;

      background: #0284c7;

    }

      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;

    function submitConsultation() {
      const nameInput = document.getElementById('input-name');
      const phoneInput = document.getElementById('input-phone');
      const descInput = document.getElementById('input-desc');

      if (nameInput) state.patientName = nameInput.value;
      if (phoneInput) state.patientPhone = phoneInput.value;
      if (descInput) state.complaintDesc = descInput.value;

      if (!state.patientName || !state.patientPhone) {
        alert(state.lang === 'en' ? 'Please enter your name and phone number' : 'يرجى إدخال اسمك ورقم الهاتف للرد عليك');
        return;
      }

      const symLabels = (state.selectedSymptoms || []).map(s => (SYMPTOMS_I18N[s] ? SYMPTOMS_I18N[s][state.lang || 'ar'] : s)).join('، ');
      const teethStr = (state.selectedSectors && state.selectedSectors.length > 0)
        ? state.selectedSectors.map(s => (SECTORS_I18N[s] ? SECTORS_I18N[s][state.lang || 'ar'] : s)).join(' + ')
        : (state.lang === 'en' ? 'General Jaw Check' : 'فحص عام بالفكين');

      const newCons = {
        id: 'c_' + Date.now(),
        patientName: state.patientName,
        patientPhone: state.patientPhone,
        symptoms: symLabels,
        pain: state.painScore,
        teeth: teethStr,
        desc: state.complaintDesc || (state.lang === 'en' ? 'Preliminary intake consultation' : 'استشارة وفحص مبدئي'),
        urgency: state.painScore >= 8 ? 'urgent' : 'moderate',
        status: 'pending',
        time: state.lang === 'en' ? 'Just now' : 'الآن',
        lastMsg: state.complaintDesc || (state.lang === 'en' ? 'New consultation request' : 'طلب استشارة جديد')
      };
      state.consultations.unshift(newCons);

      state.messages.push({
        id: 'm_' + Date.now(),
        senderRole: 'patient',
        senderName: state.patientName,
        text: `🚨 ${state.lang === 'en' ? 'New Consultation Case' : 'طلب استشارة جديد'}:\n• ${state.lang === 'en' ? 'Symptoms' : 'الأعراض'}: ${symLabels}\n• ${state.lang === 'en' ? 'Teeth' : 'الأسنان'}: ${teethStr}\n• ${state.lang === 'en' ? 'Pain Level' : 'شدة الألم'}: ${state.painScore}/10\n• ${state.lang === 'en' ? 'Notes' : 'وصف الشكوى'}: ${state.complaintDesc || (state.lang === 'en' ? 'None' : 'لا يوجد')}`,
        time: state.lang === 'en' ? 'Just now' : 'الآن'
      });

      alert(state.lang === 'en' ? 'Complaint submitted successfully! Opening chat with Dr. Karim.' : 'تم إرسال الشكوى بنجاح وبدء غرفة المحادثة مع د. كريم!');

          ${needsProfile ? `
            <div class="card" style="border-inline-start: 4px solid #0284c7; background: #f0f9ff; margin: 10px 0;">
              <strong style="font-size: 13px; color: #0369a1; display: block; margin-bottom: 3px;">
                👋 ${isEn ? 'Welcome to Direct Chat with Dr. Karim' : 'مرحباً بك في المحادثة المباشرة مع د. كريم'}
              </strong>
              <span style="font-size: 11px; color: #475569; display: block; margin-bottom: 8px;">
                ${isEn ? 'Please enter your name and phone number to begin messaging and follow-up:' : 'يرجى إدخال اسمك ورقم هاتفك أولاً لتتمكن من إرسال الرسائل ومتابعة حالتك:'}
              </span>
              <input id="chat-patient-name" class="input-field" placeholder="${isEn ? 'Full Name (e.g. John Doe)' : 'الاسم بالكامل (مثال: محمد أحمد)'}" value="${state.patientName}">
              <input id="chat-patient-phone" class="input-field" placeholder="${isEn ? 'Phone / WhatsApp (+20 100 000 0000)' : 'رقم الهاتف / الواتساب (+20 100 000 0000)'}" value="${state.patientPhone}">
              <button class="btn-primary" onclick="saveChatProfile()" style="margin-top: 6px; padding: 10px; font-size: 12px;">
                ${isEn ? 'Save & Start Chatting 💬' : 'حفظ وبدء المحادثة المباشرة 💬'}
              </button>
            </div>
          ` : ''}

          <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; margin: 10px 0;">
            ${state.messages.length === 0 ? `
              <div style="text-align: center; color: #94a3b8; font-size: 11px; margin: 30px 0;">
                ${isEn ? 'No previous messages. Start your consultation chat with Dr. Karim!' : 'لا توجد رسائل سابقة. ابدأ المحادثة المباشرة مع دكتور كريم!'}
              </div>
            ` : state.messages.map(m => {
              const isMe = (state.role === 'doctor' && m.senderRole === 'doctor') || (state.role === 'patient' && m.senderRole === 'patient');
              return `
                <div class="chat-bubble ${isMe ? 'chat-me' : 'chat-other'}">
                  <div style="font-weight: 800; font-size: 10px; margin-bottom: 2px; opacity: 0.9;">${m.senderName}</div>
                  <div style="white-space: pre-line;">${m.text}</div>
                  <div style="font-size: 9px; opacity: 0.8; text-align: ${isEn ? 'right' : 'left'}; margin-top: 4px;">${m.time}</div>
                </div>
              `;
            }).join('')}
          </div>

          <div style="display: flex; gap: 6px; align-items: center;">
            <button onclick="if(state.role==='patient'&&(!state.patientName||!state.patientPhone)){alert('يرجى إدخال اسمك ورقم هاتفك أولاً');}else{alert(isEn?'Attach image':'إرفاق صورة');}" style="padding: 10px; background: white; border: 1.5px solid #cbd5e1; border-radius: 12px; cursor: pointer;">📷</button>
            <button onclick="if(state.role==='patient'&&(!state.patientName||!state.patientPhone)){alert('يرجى إدخال اسمك ورقم هاتفك أولاً');}else{alert(isEn?'Voice message':'تسجيل رسالة صوتية');}" style="padding: 10px; background: white; border: 1.5px solid #cbd5e1; border-radius: 12px; cursor: pointer;">🎤</button>
            <input id="chat-text-input" class="input-field" style="margin-top: 0; flex: 1;" placeholder="${needsProfile ? (isEn ? 'Enter your name and phone first...' : 'أدخل اسمك ورقم هاتفك أولاً أعلاه...') : t('chatInputPlaceholder')}" onkeydown="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()" style="padding: 10px 14px; background: #0284c7; color: white; border: none; border-radius: 12px; font-weight: 900; cursor: pointer;">➤</button>
          </div>
        `;
      }

      // 5. Profile Tab
      else if (state.currentTab === 'profile') {
        if (state.role === 'doctor') {
          container.innerHTML = `
            <div class="card" style="background: #e0f2fe; border: 1.5px solid #0284c7;">
              <strong style="color: #0369a1; font-size: 14px; display: block;">${t('doctorAccountTitle')}</strong>
              <span style="font-size: 11px; color: #475569;">${state.doctorName} (karim@smartdental.com)</span>
            </div>

            <!-- App Language Card -->
            <div class="card">
              <strong style="font-size: 13px; display: block; margin-bottom: 8px;">${t('langCardTitle')}</strong>
              <div style="display: flex; gap: 8px;">
                <button onclick="state.lang='ar'; render();" style="flex: 1; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 12px; border: 1px solid ${!isEn ? '#0284c7' : '#cbd5e1'}; background: ${!isEn ? '#e0f2fe' : '#f8fafc'}; color: ${!isEn ? '#0369a1' : '#475569'}; cursor: pointer;">
                  ${t('langAr')}
                </button>
                <button onclick="state.lang='en'; render();" style="flex: 1; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 12px; border: 1px solid ${isEn ? '#0284c7' : '#cbd5e1'}; background: ${isEn ? '#e0f2fe' : '#f8fafc'}; color: ${isEn ? '#0369a1' : '#475569'}; cursor: pointer;">
                  ${t('langEn')}
                </button>
              </div>
            </div>

            <!-- Version Card -->
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div>
                  <strong style="font-size: 13px; display: block;">${t('versionTitle')}</strong>
                  <span style="font-size: 11px; color: #64748b;">${t('currentVersionLabel')} v1.2.0 (Build 12)</span>
                </div>
                <span class="badge badge-done">${t('upToDateBadge')}</span>
              </div>
              <button onclick="alert(isEn ? 'Checking for cloud updates... You have the latest version v1.2.0' : 'جاري فحص التحديثات السحابية... تطبيقك محدث لآخر إصدار v1.2.0')" class="btn-primary" style="background: #0284c7; padding: 10px; font-size: 12px;">
                ${t('checkUpdateBtn')}
              </button>
            </div>

            <div class="card">
              <button class="btn-primary" style="background: #dc2626; margin-top: 4px;" onclick="logoutDoctor()">
                ${t('logoutDoctorBtn')}
              </button>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="card">
              <strong style="font-size: 13px; display: block; margin-bottom: 8px;">${t('personalInfo')}</strong>
              <input class="input-field" placeholder="${t('patientName')}" value="${state.patientName}" oninput="state.patientName = this.value">
              <input class="input-field" placeholder="${t('patientPhone')}" value="${state.patientPhone}" oninput="state.patientPhone = this.value">
            </div>

            <!-- App Language Card -->
            <div class="card">
              <strong style="font-size: 13px; display: block; margin-bottom: 8px;">${t('langCardTitle')}</strong>
              <div style="display: flex; gap: 8px;">
                <button onclick="state.lang='ar'; render();" style="flex: 1; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 12px; border: 1px solid ${!isEn ? '#0284c7' : '#cbd5e1'}; background: ${!isEn ? '#e0f2fe' : '#f8fafc'}; color: ${!isEn ? '#0369a1' : '#475569'}; cursor: pointer;">
                  ${t('langAr')}
                </button>
                <button onclick="state.lang='en'; render();" style="flex: 1; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 12px; border: 1px solid ${isEn ? '#0284c7' : '#cbd5e1'}; background: ${isEn ? '#e0f2fe' : '#f8fafc'}; color: ${isEn ? '#0369a1' : '#475569'}; cursor: pointer;">
                  ${t('langEn')}
                </button>
              </div>
            </div>

            <!-- Version Card -->
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div>
                  <strong style="font-size: 13px; display: block;">${t('versionTitle')}</strong>
                  <span style="font-size: 11px; color: #64748b;">${t('currentVersionLabel')} v1.2.0 (Build 12)</span>
                </div>
                <span class="badge badge-done">${t('upToDateBadge')}</span>
              </div>
              <button onclick="alert(isEn ? 'Checking for cloud updates... You have the latest version v1.2.0' : 'جاري فحص التحديثات السحابية... تطبيقك محدث لآخر إصدار v1.2.0')" class="btn-primary" style="background: #0284c7; padding: 10px; font-size: 12px;">
                ${t('checkUpdateBtn')}
              </button>
            </div>

            ${state.showClinicInfoCard ? `
              <div class="card" style="border-inline-start: 4px solid #0284c7;">
                <strong style="font-size: 13px; display: block; margin-bottom: 8px;">${t('clinicAddressTitle')}</strong>
                <div style="font-size: 11px; color: #475569; line-height: 1.6;">
                  <div>📍 <strong>${isEn ? 'Address:' : 'العنوان:'}</strong> ${state.locationAddress || t('clinicAddress')}</div>
                  <div>📞 <strong>${isEn ? 'Phone:' : 'الهاتف:'}</strong> <span style="direction: ltr; display: inline-block;">${state.phoneNumber || '+20 100 000 0000'}</span></div>
                  <div>⏰ <strong>${isEn ? 'Hours:' : 'مواعيد العمل:'}</strong> ${state.workingHours || t('workingHoursText')}</div>
                </div>
              </div>
            ` : ''}

            <button onclick="loginDoctor()" style="background: #f0f9ff; border: 1.5px dashed #0284c7; color: #0284c7; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 12px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
              <span>${t('doctorLoginBtn')}</span>
            </button>
          `;
        }
      }
    }

    // Initial render
    render();
  </script>
</body>
</html>
